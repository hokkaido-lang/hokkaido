[package]
name = "hokup"
version = "0.1.0"
edition = "2024"
description = "Hokkaido toolchain installer (like rustup for hokkaido)"

[[bin]]
name = "hokup"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
flate2 = "1"
dirs = "6"
