name: Release

# Trigger on version tags like v0.11.0
on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build hokkaido via flake
        run: nix build .#hokkaido -L -o result-hokkaido

      - name: Build otaru via flake
        run: nix build .#otaru -L -o result-otaru

      - name: Build sapporo via flake
        run: nix build .#sapporo -L -o result-sapporo

      - name: Package binaries
        run: |
          mkdir -p dist/bin dist/share
          # hokkaido compiler binaries (hok-lsp only ships from the hokkaido output)
          cp result-hokkaido/bin/hokkaido dist/bin/
          cp result-hokkaido/bin/hok-lsp  dist/bin/
          # otaru package manager (already bundles its own copy of hokkaido + std)
          cp result-otaru/bin/otaru dist/bin/
          cp -r result-otaru/share/otaru dist/share/otaru
          # sapporo web app toolkit (bundles sapporo.js + sapporo.hk)
          cp result-sapporo/bin/sapporo dist/bin/
          cp -r result-sapporo/share/sapporo dist/share/sapporo
          tar -C dist -czf hokkaido-${{ matrix.asset_suffix }}.tar.gz bin share

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hokkaido-${{ matrix.asset_suffix }}
          path: hokkaido-${{ matrix.asset_suffix }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tarballs
        run: |
          mkdir -p release
          find artifacts -name "*.tar.gz" -exec cp {} release/ \;
          ls -l release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
          generate_release_notes: true
